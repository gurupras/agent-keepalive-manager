[package]
name = "agent-keepalive-desktop"
version = "0.0.0"
description = "The agent-keepalive desktop window: the local server's UI in a native webview"
license = "MIT"
edition = "2021"
publish = false

[[bin]]
name = "agent-keepalive-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
