# The usage-report hub and its Postgres database.
#
# The hub listens on 127.0.0.1:${HUB_PORT} only; the host's reverse proxy
# terminates TLS and forwards /hub/ to it (see nginx/agent-keepalive.conf).
# The landing page and /download/ are static files the proxy serves itself.
# Copy .env.example to .env and adjust. See README.md.
name: agent-keepalive

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hub
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: ${HUB_DB_PASSWORD:?set HUB_DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d hub"]
      interval: 10s
      timeout: 5s
      retries: 6

  hub:
    image: ghcr.io/gurupras/agent-keepalive-hub:${HUB_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HUB_LISTEN: ":8080"
      HUB_DATA_DIR: /data
      HUB_DATABASE_URL: postgres://hub:${HUB_DB_PASSWORD}@db:5432/hub?sslmode=disable
      HUB_BASE_PATH: /hub
      HUB_TRUST_PROXY: "true"
      HUB_DASHBOARD: ${HUB_DASHBOARD:-token}
      HUB_DASHBOARD_TOKEN: ${HUB_DASHBOARD_TOKEN:-}
      HUB_INGEST_TOKEN: ${HUB_INGEST_TOKEN:-}
      HUB_RETENTION_DAYS: ${HUB_RETENTION_DAYS:-730}
    volumes:
      - hub-data:/data
    ports:
      - "127.0.0.1:${HUB_PORT:-6720}:8080"

volumes:
  db-data:
  hub-data:
