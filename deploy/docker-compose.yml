# The agent-keepalive host: the hub at /hub, downloads (artifacts, update feed,
# package repositories) at /download, and a landing page at /.
#
# Assumes a Traefik already running on this host, on the docker network named
# by TRAEFIK_NETWORK, with a certificate resolver named by TRAEFIK_CERTRESOLVER.
# Copy .env.example to .env and adjust. See README.md.
name: agent-keepalive

services:
  hub:
    image: ghcr.io/gurupras/agent-keepalive-hub:${HUB_TAG:-latest}
    restart: unless-stopped
    environment:
      HUB_LISTEN: ":8080"
      HUB_DATA_DIR: /data
      HUB_BASE_PATH: /hub
      HUB_TRUST_PROXY: "true"
      HUB_DASHBOARD: ${HUB_DASHBOARD:-public}
      HUB_DASHBOARD_TOKEN: ${HUB_DASHBOARD_TOKEN:-}
      HUB_INGEST_TOKEN: ${HUB_INGEST_TOKEN:-}
      HUB_RETENTION_DAYS: ${HUB_RETENTION_DAYS:-730}
    volumes:
      - hub-data:/data
    networks: [traefik]
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik}
      traefik.http.routers.agent-keepalive-hub.rule: Host(`${SITE_HOST:-agent-keepalive.gurupras.me}`) && PathPrefix(`/hub`)
      traefik.http.routers.agent-keepalive-hub.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.agent-keepalive-hub.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-letsencrypt}
      traefik.http.routers.agent-keepalive-hub.priority: "20"
      traefik.http.services.agent-keepalive-hub.loadbalancer.server.port: "8080"

  downloads:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./site:/srv/site:ro
      # Written by the release workflow over ssh (DOWNLOAD_ROOT).
      - ${DOWNLOAD_ROOT:-/srv/agent-keepalive/download}:/srv/download:ro
    networks: [traefik]
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik}
      traefik.http.routers.agent-keepalive-site.rule: Host(`${SITE_HOST:-agent-keepalive.gurupras.me}`)
      traefik.http.routers.agent-keepalive-site.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.agent-keepalive-site.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-letsencrypt}
      traefik.http.routers.agent-keepalive-site.priority: "10"
      traefik.http.services.agent-keepalive-site.loadbalancer.server.port: "80"

volumes:
  hub-data:

networks:
  traefik:
    name: ${TRAEFIK_NETWORK:-traefik}
    external: true
