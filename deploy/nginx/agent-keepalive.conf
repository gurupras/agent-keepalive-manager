# Host nginx site for agent-keepalive: the landing page at /, release
# downloads at /download/, and the hub (docker-compose.yml) at /hub/.
#
# Replace the placeholders and the certificate lines, link this file into
# /etc/nginx/sites-enabled/, then `nginx -t && systemctl reload nginx`.
#   SITE_DIR   deploy/site from this repository
#   WWW_ROOT   the directory holding download/ (DOWNLOAD_ROOT is WWW_ROOT/download)
#   6720       HUB_PORT from .env

server {
    listen 80;
    server_name agent-keepalive.gurupras.me;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name agent-keepalive.gurupras.me;
    server_tokens off;
    absolute_redirect off;

    ssl_certificate     /etc/letsencrypt/live/example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example/privkey.pem;

    location = /hub { return 301 /hub/; }
    location /hub/ {
        proxy_pass http://127.0.0.1:6720;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The hub (HUB_TRUST_PROXY) takes the last X-Forwarded-For entry.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 128k;
    }

    location / {
        root SITE_DIR;
        index index.html;
        try_files $uri $uri/ =404;
    }

    location = /download { return 301 /download/; }
    location /download/ {
        # /download/x is WWW_ROOT/download/x (root, not alias: the nested
        # regex locations below inherit root cleanly).
        root WWW_ROOT;
        autoindex on;
        autoindex_exact_size off;
        # `current` in each repository is a symlink to a generation.
        disable_symlinks off;

        # Two types blocks at the same level are merged: the stock table
        # (which already has deb, rpm and exe) plus the formats it lacks.
        include /etc/nginx/mime.types;
        types {
            application/zstd                      zst;
            application/vnd.appimage              appimage;
            application/octet-stream              pkg;
            application/pgp-signature             sig asc gpg;
            text/plain                            sources list repo conf;
        }

        location ~ /SHA256SUMS$ { default_type text/plain; }
        # Mutable names must never be served stale: the update feed and the
        # repository indexes. Everything else lives at a versioned path.
        location ~ (latest\.json|InRelease|Release(\.gpg)?|Packages(\.gz)?|repomd\.xml(\.asc)?|\.db(\.sig)?|\.files(\.sig)?)$ {
            add_header Cache-Control "no-cache" always;
        }
        # Uploads in progress.
        location ~ /\.incoming/ { return 404; }
    }
}
