# Landing page at /, release downloads at /download/.
server {
    listen 80;
    server_name _;
    server_tokens off;
    # Relative redirects: TLS ends at Traefik, so nginx does not know the scheme.
    absolute_redirect off;

    # Two types blocks at the same level are merged: the stock table (which
    # already has deb, rpm and exe) plus the formats it lacks.
    include /etc/nginx/mime.types;
    types {
        application/zstd                      zst;
        application/vnd.appimage              appimage;
        application/octet-stream              pkg;
        application/pgp-signature             sig asc gpg;
        text/plain                            sources list repo conf;
    }

    location = /download/SHA256SUMS { root /srv; default_type text/plain; }
    location ~ ^/download/[^/]+/SHA256SUMS$ { root /srv; default_type text/plain; }

    location / {
        root /srv/site;
        index index.html;
        try_files $uri $uri/ =404;
    }

    location = /download { return 301 /download/; }

    location /download/ {
        # /download/x is /srv/download/x (root, not alias: nested regex
        # locations below inherit root cleanly).
        root /srv;
        autoindex on;
        autoindex_exact_size off;
        # `current` in each repository is a symlink to a generation.
        disable_symlinks off;

        # Mutable names must never be served stale: the update feed and the
        # repository indexes. Everything else lives at a versioned path.
        location ~ (latest\.json|InRelease|Release(\.gpg)?|Packages(\.gz)?|repomd\.xml(\.asc)?|\.db(\.sig)?|\.files(\.sig)?)$ {
            add_header Cache-Control "no-cache" always;
        }
        # Uploads in progress.
        location ~ /\.incoming/ { return 404; }
    }
}
