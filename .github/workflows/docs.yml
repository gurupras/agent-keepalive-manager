name: Docs

# Builds the VitePress site in docs/ on every change to it. On main it is
# uploaded to the download host's SITE_ROOT, which nginx serves at /.
# Uploading needs the DOWNLOAD_SSH_* secrets (docs/releasing.md) and the
# SITE_ROOT variable (/site: the path inside the upload container); without
# SITE_ROOT the site is only built.

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # lastUpdated reads each page's last commit.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Build
        working-directory: docs
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs/.vitepress/dist
          retention-days: 7

      - name: Upload to the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          SSH_KEY: ${{ secrets.DOWNLOAD_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DOWNLOAD_SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.DOWNLOAD_SSH_HOST }}
          SSH_USER: ${{ secrets.DOWNLOAD_SSH_USER }}
          SSH_PORT: ${{ secrets.DOWNLOAD_SSH_PORT }}
          SITE_ROOT: ${{ vars.SITE_ROOT }}
        run: |
          if [ -z "$SITE_ROOT" ] || [ -z "$SSH_HOST" ]; then
            echo "::notice::SITE_ROOT or DOWNLOAD_SSH_HOST is not set: site built, not uploaded"
            exit 0
          fi
          install -d -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/ssh/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/key"
          ssh="ssh -p ${SSH_PORT:-22} -i $RUNNER_TEMP/ssh/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts"
          # Hashed assets first, then the pages that reference them, so a
          # reader never gets a page whose assets are missing. Old assets are
          # removed last, once no new page needs them.
          rsync -rlt --chmod=D755,F644 -e "$ssh" docs/.vitepress/dist/assets/ "${SSH_USER}@${SSH_HOST}:${SITE_ROOT}/assets/"
          rsync -rlt --chmod=D755,F644 --delay-updates --exclude=/assets/ --delete-after -e "$ssh" docs/.vitepress/dist/ "${SSH_USER}@${SSH_HOST}:${SITE_ROOT}/"
          rsync -rlt --delete-after -e "$ssh" docs/.vitepress/dist/assets/ "${SSH_USER}@${SSH_HOST}:${SITE_ROOT}/assets/"
          echo "### Site uploaded to ${SITE_ROOT}" >> "$GITHUB_STEP_SUMMARY"
