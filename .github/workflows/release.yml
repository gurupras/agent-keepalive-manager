name: Release

# A v* tag builds, packages and publishes a release. Running the workflow by
# hand (Actions > Release > Run workflow) is a dry run: everything is built and
# tested and kept as workflow artifacts, nothing is published.
#
# Pre-releases (a tag with a hyphen, e.g. v1.2.0-rc.1) are published to GitHub
# as pre-releases and uploaded to the download host, but never move
# latest.json, the stable package repositories, the Homebrew tap or the
# hub image's :latest tag.
#
# Secrets and variables: docs/releasing.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version="${GITHUB_REF_NAME#v}"
            publish=true
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::tag ${GITHUB_REF_NAME} is not vX.Y.Z[-pre]"; exit 1; }
          else
            version="$(scripts/version.sh)"
            publish=false
          fi
          prerelease=false
          case "$version" in *-*) prerelease=true;; esac
          {
            echo "version=${version}"
            echo "prerelease=${prerelease}"
            echo "publish=${publish}"
          } >> "$GITHUB_OUTPUT"
          echo "### ${version} (prerelease: ${prerelease}, publish: ${publish})" >> "$GITHUB_STEP_SUMMARY"

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            hub/web/package-lock.json
      - run: make ui
      - uses: actions/upload-artifact@v4
        with:
          name: ui
          path: |
            web/dist
            hub/web/dist

  linux:
    name: Build and package (Linux, Windows)
    needs: [meta, ui]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: ui
      - name: Profile
        env:
          ORG_PROFILE: ${{ secrets.ORG_PROFILE }}
          PROFILE_FILE: ${{ vars.PROFILE_FILE }}
          PUBLISH: ${{ needs.meta.outputs.publish }}
        run: |
          if [ -n "$ORG_PROFILE" ]; then
            printf '%s\n' "$ORG_PROFILE" > "$RUNNER_TEMP/profile.env"
            echo "PROFILE=$RUNNER_TEMP/profile.env" >> "$GITHUB_ENV"
          else
            echo "PROFILE=${PROFILE_FILE:-profiles/public.env}" >> "$GITHUB_ENV"
          fi
      - name: Check profile
        env:
          PUBLISH: ${{ needs.meta.outputs.publish }}
        run: |
          if [ "$PUBLISH" = true ]; then scripts/profile.sh check --release; else scripts/profile.sh check; fi
          scripts/profile.sh show
      - name: Tools
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          sudo apt-get update -qq
          sudo apt-get install -y -qq nsis osslsigncode
      - name: Package
        env:
          WINDOWS_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          WINDOWS_SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
        run: make dist-linux
      - name: Sign the rpm packages
        env:
          REPO_SIGNING_KEY: ${{ secrets.REPO_SIGNING_KEY }}
        run: |
          if [ -n "$REPO_SIGNING_KEY" ]; then
            packaging/repository/publish.sh sign dist
          else
            echo "::warning::REPO_SIGNING_KEY is not set: rpm packages are unsigned"
          fi
      - name: Install the deb and run it
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" -e AGENT_KEEPALIVE_INSTALL_NO_REPOSITORY=1 debian:stable-slim sh -c \
            "apt-get update -qq && apt-get install -y -qq /dist/agent-keepalive_${VERSION}_amd64.deb >/dev/null && agent-keepalive version"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/
          if-no-files-found: error

  macos:
    name: Package (macOS)
    needs: [meta, ui]
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: ui
      - name: Profile
        env:
          ORG_PROFILE: ${{ secrets.ORG_PROFILE }}
          PROFILE_FILE: ${{ vars.PROFILE_FILE }}
        run: |
          if [ -n "$ORG_PROFILE" ]; then
            printf '%s\n' "$ORG_PROFILE" > "$RUNNER_TEMP/profile.env"
            echo "PROFILE=$RUNNER_TEMP/profile.env" >> "$GITHUB_ENV"
          else
            echo "PROFILE=${PROFILE_FILE:-profiles/public.env}" >> "$GITHUB_ENV"
          fi
      - name: Import signing certificates
        env:
          MACOS_CERTS_P12: ${{ secrets.MACOS_CERTS_P12 }}
          MACOS_CERTS_PASSWORD: ${{ secrets.MACOS_CERTS_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTS_P12" ]; then
            echo "No MACOS_CERTS_P12: the .pkg is built unsigned"
            exit 0
          fi
          kc="$RUNNER_TEMP/release.keychain-db"
          pw="$(uuidgen)"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          printf '%s' "$MACOS_CERTS_P12" | base64 --decode > "$RUNNER_TEMP/certs.p12"
          security import "$RUNNER_TEMP/certs.p12" -k "$kc" -P "$MACOS_CERTS_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/pkgbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" >/dev/null
          # Add ours to the search list, keeping the existing keychains.
          # (A read loop, not mapfile: macOS runs bash 3.2.)
          keychains=()
          while IFS= read -r k; do keychains+=("$k"); done \
            < <(security list-keychains -d user | tr -d '"' | sed 's/^[[:space:]]*//')
          security list-keychains -d user -s "$kc" "${keychains[@]}"
          rm -f "$RUNNER_TEMP/certs.p12"
          echo "MACOS_KEYCHAIN=$kc" >> "$GITHUB_ENV"
      - name: Build the .pkg
        env:
          MACOS_APP_IDENTITY: ${{ secrets.MACOS_APP_IDENTITY }}
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: make macos-pkg
      - name: Run the darwin binary
        run: bin/macos-pkg/darwin_arm64/agent-keepalive version
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/*.pkg
          if-no-files-found: error

  windows-smoke:
    name: Smoke test (Windows)
    needs: linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-linux
          path: dist
      - shell: pwsh
        run: ./packaging/windows/smoke-test.ps1 -Dist dist

  hub-image:
    name: Hub image
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - if: needs.meta.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        env:
          V: ${{ needs.meta.outputs.version }}
          PRE: ${{ needs.meta.outputs.prerelease }}
        run: |
          tags="ghcr.io/gurupras/agent-keepalive-hub:${V}"
          [ "$PRE" = true ] || tags="${tags},ghcr.io/gurupras/agent-keepalive-hub:latest"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: hub/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ needs.meta.outputs.version }}
          push: ${{ needs.meta.outputs.publish == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish
    needs: [meta, linux, macos, windows-smoke, hub-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      PRERELEASE: ${{ needs.meta.outputs.prerelease }}
      PUBLISH: ${{ needs.meta.outputs.publish }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Profile
        env:
          ORG_PROFILE: ${{ secrets.ORG_PROFILE }}
          PROFILE_FILE: ${{ vars.PROFILE_FILE }}
        run: |
          if [ -n "$ORG_PROFILE" ]; then
            printf '%s\n' "$ORG_PROFILE" > "$RUNNER_TEMP/profile.env"
            echo "PROFILE=$RUNNER_TEMP/profile.env" >> "$GITHUB_ENV"
          else
            echo "PROFILE=${PROFILE_FILE:-profiles/public.env}" >> "$GITHUB_ENV"
          fi
      - name: Release notes from the tag annotation
        run: |
          if [ "$PUBLISH" = true ]; then
            git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
            git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)' \
              | sed '/-----BEGIN PGP SIGNATURE-----/,$d' > "$RUNNER_TEMP/notes.md"
          fi
          [ -s "$RUNNER_TEMP/notes.md" ] || echo "agent-keepalive ${VERSION}" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: SHA256SUMS
        run: |
          ls -l dist
          packaging/checksums.sh
      - name: Update feed
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          # The version folder on the download host; the GitHub release when
          # the profile has no download host.
          dl="$(scripts/profile.sh get DOWNLOAD_URL)"
          if [ -n "$dl" ]; then
            base="${dl%/}/${VERSION}"
          else
            base="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}"
          fi
          # Never -allow-unsigned: an updater refuses an unsigned feed.
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            [ "$PUBLISH" = true ] && { echo "::error::UPDATE_SIGNING_KEY is required to publish"; exit 1; }
            echo "::warning::UPDATE_SIGNING_KEY is not set: dry run without a feed"
            exit 0
          fi
          files=()
          for f in dist/*; do [ "$(basename "$f")" = SHA256SUMS ] || files+=("$f"); done
          go run ./tools/release feed -version "$VERSION" -base-url "$base" \
            -notes "$RUNNER_TEMP/notes.md" \
            -page "https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${VERSION}" \
            -out dist/latest.json "${files[@]}"
      - name: Keep the dry run's output
        if: needs.meta.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run
          path: dist/

      - name: Attest build provenance
        if: needs.meta.outputs.publish == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.AppImage
            dist/*.exe
            dist/*.pkg
      - name: GitHub release
        if: needs.meta.outputs.publish == 'true'
        run: |
          pre=()
          [ "$PRERELEASE" = true ] && pre=(--prerelease)
          gh release create "v${VERSION}" dist/* --verify-tag --title "${VERSION}" \
            --notes-file "$RUNNER_TEMP/notes.md" "${pre[@]}"

      - name: ssh to the download host
        if: needs.meta.outputs.publish == 'true'
        env:
          DOWNLOAD_SSH_KEY: ${{ secrets.DOWNLOAD_SSH_KEY }}
          DOWNLOAD_SSH_KNOWN_HOSTS: ${{ secrets.DOWNLOAD_SSH_KNOWN_HOSTS }}
          DOWNLOAD_SSH_HOST: ${{ secrets.DOWNLOAD_SSH_HOST }}
          DOWNLOAD_SSH_USER: ${{ secrets.DOWNLOAD_SSH_USER }}
          DOWNLOAD_ROOT: ${{ secrets.DOWNLOAD_ROOT }}
          DOWNLOAD_SSH_PORT: ${{ secrets.DOWNLOAD_SSH_PORT }}
        run: |
          if [ -z "$DOWNLOAD_SSH_HOST" ]; then
            echo "::warning::DOWNLOAD_SSH_HOST is not set: nothing is uploaded to a download host"
            exit 0
          fi
          install -d -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$DOWNLOAD_SSH_KEY" > "$RUNNER_TEMP/ssh/key"
          printf '%s\n' "$DOWNLOAD_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/key"
          {
            echo "DOWNLOAD_SSH_KEY_FILE=$RUNNER_TEMP/ssh/key"
            echo "DOWNLOAD_SSH_KNOWN_HOSTS_FILE=$RUNNER_TEMP/ssh/known_hosts"
            echo "DOWNLOAD_SSH_HOST=$DOWNLOAD_SSH_HOST"
            echo "DOWNLOAD_SSH_USER=$DOWNLOAD_SSH_USER"
            echo "DOWNLOAD_ROOT=$DOWNLOAD_ROOT"
            echo "DOWNLOAD_SSH_PORT=${DOWNLOAD_SSH_PORT:-22}"
            echo "DOWNLOAD_ENABLED=true"
          } >> "$GITHUB_ENV"
      - name: Upload to the download host
        if: needs.meta.outputs.publish == 'true' && env.DOWNLOAD_ENABLED == 'true'
        run: packaging/upload-ssh.sh release "$VERSION" dist
      - name: Package repositories
        if: needs.meta.outputs.publish == 'true' && needs.meta.outputs.prerelease != 'true' && env.DOWNLOAD_ENABLED == 'true'
        env:
          REPO_SIGNING_KEY: ${{ secrets.REPO_SIGNING_KEY }}
        run: |
          if [ -z "$REPO_SIGNING_KEY" ]; then
            echo "::warning::REPO_SIGNING_KEY is not set: repositories not published"
            exit 0
          fi
          packaging/repository/publish.sh publish "$VERSION" dist
      - name: Homebrew tap
        if: needs.meta.outputs.publish == 'true' && needs.meta.outputs.prerelease != 'true'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          HOMEBREW_TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set: tap not updated"
            exit 0
          fi
          HOMEPAGE="$(scripts/profile.sh get HOMEPAGE)" packaging/homebrew/render-formula.sh "$VERSION" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}" dist/SHA256SUMS \
            "$RUNNER_TEMP/agent-keepalive.rb"
          packaging/homebrew/publish-tap.sh "$RUNNER_TEMP/agent-keepalive.rb" "$VERSION"
      # Last: from here on, every self-updating install sees the release.
      - name: Move latest.json
        if: needs.meta.outputs.publish == 'true' && needs.meta.outputs.prerelease != 'true' && env.DOWNLOAD_ENABLED == 'true'
        run: packaging/upload-ssh.sh latest dist/latest.json
