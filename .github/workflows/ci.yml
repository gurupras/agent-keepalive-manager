name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION_FILE: go.mod

jobs:
  ui:
    name: UIs (lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            hub/web/package-lock.json
      - name: web
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run build
      - name: hub/web
        working-directory: hub/web
        run: |
          npm ci
          npm run lint
          npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: ui
          path: |
            web/dist
            hub/web/dist
          retention-days: 3

  go-test:
    name: Go test (${{ matrix.os }})
    needs: ui
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v8
        with:
          name: ui
      - name: go test -race
        run: go test -race ./...

  go-lint:
    name: Go lint
    needs: ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v8
        with:
          name: ui
      - name: gofmt
        run: make fmt-check
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  scripts-lint:
    name: shellcheck + actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -x -P SCRIPTDIR -S warning scripts/*.sh packaging/*.sh packaging/*/*.sh packaging/appimage/AppRun \
            packaging/macos/postinstall packaging/macos/launcher.sh
          # The package scripts are rendered from templates; check them as sh.
          shellcheck -s sh -S warning packaging/linux/postinstall.sh.in packaging/linux/postremove.sh.in
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  cross:
    name: Cross-compile
    needs: ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v8
        with:
          name: ui
      - name: Six targets, public profile
        run: PROFILE=profiles/public.env make cross

  packaging:
    name: Packaging smoke test
    needs: ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v8
        with:
          name: ui
      - name: Tools
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.3
          sudo apt-get update -qq && sudo apt-get install -y -qq nsis
      - name: deb, rpm, arch, AppImage, Windows, archives (dev build)
        run: make dist-linux checksums
      - name: Install and run the packages
        run: |
          set -x
          v="$(scripts/version.sh)"
          docker run --rm -v "$PWD/dist:/dist:ro" debian:stable-slim sh -c \
            "apt-get update -qq && apt-get install -y -qq /dist/agent-keepalive_${v}_amd64.deb >/dev/null && agent-keepalive version && test -f /usr/lib/systemd/user/agent-keepalive.service && apt-get remove -y -qq agent-keepalive >/dev/null"
          docker run --rm -v "$PWD/dist:/dist:ro" fedora:latest sh -c \
            "dnf install -y -q /dist/agent-keepalive-${v}-1.x86_64.rpm && agent-keepalive version && dnf remove -y -q agent-keepalive"
          docker run --rm -v "$PWD/dist:/dist:ro" archlinux:latest sh -c \
            "pacman -U --noconfirm /dist/agent-keepalive-${v}-1-x86_64.pkg.tar.zst >/dev/null && agent-keepalive version && pacman -R --noconfirm agent-keepalive >/dev/null"
          "dist/agent-keepalive-${v}-x86_64.AppImage" --appimage-extract-and-run version
      - uses: actions/upload-artifact@v7
        with:
          name: dist-dev
          path: dist/
          retention-days: 3

  windows-smoke:
    name: Windows smoke test
    needs: packaging
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist-dev
          path: dist
      - name: Portable exe and setup
        shell: pwsh
        run: ./packaging/windows/smoke-test.ps1 -Dist dist

  hub-image:
    name: Hub image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: hub/Dockerfile
          push: false
          build-args: VERSION=0.0.0-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
