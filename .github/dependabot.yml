version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    groups:
      go: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups:
      web: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /hub/web
    schedule: { interval: weekly }
    groups:
      hub-web: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /hub
    schedule: { interval: weekly }
  - package-ecosystem: cargo
    directory: /desktop
    schedule: { interval: weekly }
    groups:
      desktop: { patterns: ["*"] }
